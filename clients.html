<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clients - Freelance Invoice Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>Freelance Invoice Tracker</h1>

        <nav>

            <a href="clients.html" class="active">Clients</a>

            <a href="projects.html">Projects</a>

            <a href="invoices.html">Invoices</a>

        </nav>

    </header>

    <main>

        <div id="message" class="message"></div>

        <section class="card">

            <h2>Add a client</h2>

            <form id="client-form">

                <label>Name <input id="client-name" placeholder="Bardhi Design"></label>

                <label>Email <input id="client-email" type="email" placeholder="info@bardhi.com"></label>

                <button type="submit">Save client</button>

            </form>

        </section>

        <section class="card">

            <h2>Clients</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody id="client-list"></tbody>

            </table>

        </section>

    </main>

    <script type="module" src="src/main.js"></script>
</body>

</html>
